name: Preflight tooling
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline negative-case tests
        run: |
          python3 tools/test-preflight.py
          python3 tools/test-acceptance-ledger.py
          python3 tools/test-acceptance-verdict.py
          python3 tools/test-requirements-baseline.py
      - name: Compile Python tooling
        run: python3 -m compileall -q tools
  fsharp-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the F# requirements compiler and its tests
        run: dotnet build tools/requirements-compiler/tests -c Release
      - name: Offline tests (baseline port reproduces the committed baseline, units, preflight verdict)
        run: dotnet run -c Release --no-build --project tools/requirements-compiler/tests -- --offline --source .
      - name: Rehearsal clock replays the Rehearsal 4 timeline (overdue, lateness, ledger counts)
        run: tools/rehearsal-clock/test-clock.sh
      - name: F# and Python baseline generators agree byte for byte at this commit
        run: |
          python3 -I tools/build-requirements-baseline.py . "$GITHUB_SHA" > "$RUNNER_TEMP/py.json"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll baseline . "$GITHUB_SHA" > "$RUNNER_TEMP/fs.json"
          cmp "$RUNNER_TEMP/py.json" "$RUNNER_TEMP/fs.json"
      - name: Check out the approved Causa GitHub adapter (indy-init-rehearsal-002 at its accepted commit)
        uses: actions/checkout@v4
        with:
          repository: kemiller2002/indy-init-rehearsal-002
          ref: b053d1da4ef533fba7d6728c369c58a29a1e2440
          path: .adapter
          persist-credentials: false
      - name: Build the T05 persistence verifier against that adapter
        run: dotnet build tools/persistence-verification -c Release -p:CausaEngineDir="$GITHUB_WORKSPACE/.adapter/src/engine"
