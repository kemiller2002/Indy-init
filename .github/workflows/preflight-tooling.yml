name: Preflight tooling
# Playwright browsers (docs/ci-playwright-mitigation/FINAL-REPORT.md): the adversarial jobs run in Microsoft's
# mcr.microsoft.com/playwright:v1.63.0-noble image, which carries Chromium, WebKit and their OS libraries, so they install
# no browser (on 2026-11-05 `playwright install --with-deps` on the runner used the whole 45-minute budget three times
# before any case ran). The other browser steps install on the runner with a step time limit: a stall fails that step,
# named, rather than consuming the job; there is no in-script kill or retry (killing apt mid-install is not safe).
# Directive workstream C: a PR commit ran this workflow twice (push and pull_request events, same commit, every job),
# doubling runner load while three sessions had PRs open. Push now runs only on main; PRs run on pull_request (the
# merge result), and a newer commit on the same PR cancels the older run (its checks are on the old commit, so the new
# head's required checks are unaffected). Pushes to main and manual runs are grouped per commit, so none is cancelled.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: preflight-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The acceptance ledger and verdict tools are the last Python, kept until they are ported to F#; new tooling is F#
      # only (docs/OWNER-DECISIONS-2026-11-01.md), which the F# offline suite enforces.
      - name: Run the acceptance ledger and verdict tools' negative-case tests (Python, pending the F# port)
        run: |
          python3 tools/test-acceptance-ledger.py
          python3 tools/test-acceptance-verdict.py
      - name: Compile the remaining Python tooling
        run: python3 -m compileall -q tools
  # Compiled package v4 is frozen at tag indy-init-requirements-v4.0.0 and is never recompiled with a later compiler:
  # its files on this commit must equal the tagged ones, and the tagged compiler and test suite reproduce them.
  frozen-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compiled package v4 on this commit is the frozen one (tag indy-init-requirements-v4.0.0 at c9dc556, the owner's freeze)
        run: |
          git fetch --quiet --force origin 'refs/tags/indy-init-requirements-v4.0.0:refs/tags/indy-init-requirements-v4.0.0'
          # A moved tag must not silently become the baseline: it must still name the commit the owner froze.
          test "$(git rev-parse 'indy-init-requirements-v4.0.0^{commit}')" = c9dc556ef2b0d389e8ccc07b729f00fccd19fba7 || { echo "tag indy-init-requirements-v4.0.0 no longer names c9dc556"; exit 1; }
          if ! git diff --quiet indy-init-requirements-v4.0.0 HEAD -- requirements-compiled/v4; then
            echo "requirements-compiled/v4 differs from the frozen tag indy-init-requirements-v4.0.0:"
            git diff --stat indy-init-requirements-v4.0.0 HEAD -- requirements-compiled/v4
            exit 1
          fi
          git worktree add --quiet --detach "$RUNNER_TEMP/v4-frozen" indy-init-requirements-v4.0.0
      - name: Compiled packages v4.1, v4.1.1, v4.1.2 and v4.1.4 on this commit are the frozen ones (tags indy-init-requirements-v4.1.0 at 183bbb4, indy-init-requirements-v4.1.1 at f85081f indy-init-requirements-v4.1.2 at 485b8a9 and indy-init-requirements-v4.1.4 at 208ec9f)
        run: |
          frozen() {
            tag=$1 commit=$2 dir=$3
            git fetch --quiet --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$commit" || { echo "tag $tag no longer names $commit"; exit 1; }
            if ! git diff --quiet "$tag" HEAD -- "$dir"; then
              echo "$dir differs from the frozen tag $tag:"
              git diff --stat "$tag" HEAD -- "$dir"
              exit 1
            fi
          }
          frozen indy-init-requirements-v4.1.0 183bbb4abce1f00f59a37565ddb508c1d262895b requirements-compiled/v4.1
          frozen indy-init-requirements-v4.1.1 f85081f8321e773ee5a564d183930e8fab20ef55 requirements-compiled/v4.1.1
          frozen indy-init-requirements-v4.1.2 485b8a90972f5a996ed3dba3d9db17952fd677f9 requirements-compiled/v4.1.2
          frozen indy-init-requirements-v4.1.4 208ec9f187578c0e9c8b871361e302e58ffb84ba requirements-compiled/v4.1.4
      - name: Install the SDK the tagged compiler pins (the tag's global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ runner.temp }}/v4-frozen/global.json
      - name: Check out the five Rehearsal 7 evidence files the v4 lesson analysis quotes (evidence only, never a build input)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --no-checkout https://github.com/kemiller2002/indy-init-rehearsal-007 "$RUNNER_TEMP/r7"
          git -C "$RUNNER_TEMP/r7" fetch --quiet --depth 1 origin 9b307aa1d3d7d5e6fe1737680d03bf74fd90c1a9
          git -C "$RUNNER_TEMP/r7" sparse-checkout set --no-cone /evidence/FINAL-REPORT.md /evidence/provenance.md /evidence/defects.md /evidence/DECISIONS.md /evidence/traceability.json
          git -C "$RUNNER_TEMP/r7" checkout --quiet 9b307aa1d3d7d5e6fe1737680d03bf74fd90c1a9
          echo "CAUSA_R7_EVIDENCE=$RUNNER_TEMP/r7" >> "$GITHUB_ENV"
      - name: Check out echelon-registry at the release-set commit compiled package v4 pins
        uses: actions/checkout@v4
        with:
          repository: kemiller2002/echelon-registry
          ref: 7a2c27a3db7cab4337ea47536f3e1fc22d257f03
          path: .echelon-registry
          persist-credentials: false
      - name: The tagged compiler and its offline test suite pass at the tag
        working-directory: ${{ runner.temp }}/v4-frozen
        run: |
          dotnet build tools/requirements-compiler/tests -c Release
          dotnet run -c Release --no-build --project tools/requirements-compiler/tests -- --offline --source . --record "$RUNNER_TEMP/v4-frozen-record.json"
      - name: The tagged compiler reproduces the frozen package v4 byte for byte (checks W01-W16, status READY-FOR-OWNER-FREEZE)
        working-directory: ${{ runner.temp }}/v4-frozen
        run: dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v4 --source . --package requirements-compiled/v4 --registry "$GITHUB_WORKSPACE/.echelon-registry" --r7-evidence "$CAUSA_R7_EVIDENCE" --verify-test-record "$RUNNER_TEMP/v4-frozen-record.json" --check
  fsharp-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: CTP-001 readiness check holds its cases and its EXP-INDY-002 replay (docs/execution/contract-triggered-parallel)
        run: dotnet fsi tools/execution/ctp-check.fsx -- test --indy-init .
      - name: Echelon stack-drift preflight holds its cases, negative controls and v4 lock equivalence (ODR-ESU-04 A)
        run: |
          git init --quiet "$RUNNER_TEMP/echelon-registry"
          git -C "$RUNNER_TEMP/echelon-registry" fetch --quiet --depth 1 https://github.com/kemiller2002/echelon-registry 575240233d1fc32b57cfa827ea1031b68609fc58 7a2c27a3db7cab4337ea47536f3e1fc22d257f03
          dotnet fsi tools/stack-drift/stack-drift.fsx -- test --registry "$RUNNER_TEMP/echelon-registry"
      - name: Build the F# requirements compiler and its tests
        run: dotnet build tools/requirements-compiler/tests -c Release
      - name: Check out the five Rehearsal 7 evidence files the v4 lesson analysis quotes (evidence only, never a build input)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --no-checkout https://github.com/kemiller2002/indy-init-rehearsal-007 "$RUNNER_TEMP/r7"
          git -C "$RUNNER_TEMP/r7" fetch --quiet --depth 1 origin 9b307aa1d3d7d5e6fe1737680d03bf74fd90c1a9
          git -C "$RUNNER_TEMP/r7" sparse-checkout set --no-cone /evidence/FINAL-REPORT.md /evidence/provenance.md /evidence/defects.md /evidence/DECISIONS.md /evidence/traceability.json
          git -C "$RUNNER_TEMP/r7" checkout --quiet 9b307aa1d3d7d5e6fe1737680d03bf74fd90c1a9
          echo "CAUSA_R7_EVIDENCE=$RUNNER_TEMP/r7" >> "$GITHUB_ENV"
      - name: Offline tests (baseline reproduces the committed baseline, units, preflight verdict, v4 and v4.1 scope and controls, F#-only tooling)
        run: dotnet run -c Release --no-build --project tools/requirements-compiler/tests -- --offline --source .
      - name: The F# baseline generator (authoritative since 2026-11-01) runs at this commit
        run: dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll baseline . "$GITHUB_SHA" > "$RUNNER_TEMP/baseline.json"
      - name: Rehearsal 7 persistence requirements (ADR-R7-001) and the validator's negative controls
        run: |
          args="--root . --baseline requirements/causa-requirements-baseline-r7.json --previous requirements/causa-requirements-baseline-r6.json --trace docs/rehearsal-007/traceability.json"
          dotnet fsi tools/validate-r7-persistence-requirements.fsx -- $args
          dotnet fsi tools/validate-r7-persistence-requirements.fsx -- $args --self-test true
      - name: Download the Forma 0.12.0 npm tarball compiled package v4.1 pins, and verify its SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/forma.tgz" https://registry.npmjs.org/@echelon-foundry/design-system/-/design-system-0.12.0.tgz
          echo "b824568d528562658ded3d53ecd06504e907f7d42129facd86a8f298d1cb7aae  $RUNNER_TEMP/forma.tgz" | sha256sum -c -
      - name: Compiled package v4.1 is reproduced byte for byte, its Forma inventory matches the published package, and its checks X01-X16 pass
        run: dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1 --base requirements-compiled/v4 --forma-tarball "$RUNNER_TEMP/forma.tgz" --check
      - name: The frozen v4.1 interface contracts typecheck, and each negative control (forged Confirmation, credential read) is refused (built outside the checkout)
        run: |
          cp -r requirements-compiled/v4.1/contracts "$RUNNER_TEMP/contracts"
          cp global.json "$RUNNER_TEMP/contracts/"
          dotnet build "$RUNNER_TEMP/contracts/ContractCheck.fsproj" -c Release
          for negative in "$RUNNER_TEMP"/contracts/negative/*.fs; do
            name=$(basename "$negative")
            cp "$RUNNER_TEMP/contracts/ContractCheck.fsproj" "$RUNNER_TEMP/contracts/Negative.fsproj"
            sed -i "s|</ItemGroup>|  <Compile Include=\"negative/$name\" />\n  </ItemGroup>|" "$RUNNER_TEMP/contracts/Negative.fsproj"
            if dotnet build "$RUNNER_TEMP/contracts/Negative.fsproj" -c Release > "$RUNNER_TEMP/negative.log" 2>&1; then echo "$name compiled but must not"; exit 1; fi
            grep -q FS1093 "$RUNNER_TEMP/negative.log" || { echo "$name failed for another reason"; cat "$RUNNER_TEMP/negative.log"; exit 1; }
            rm "$RUNNER_TEMP/contracts/Negative.fsproj"
          done
      - name: The predefined project structure bootstraps into an empty repository and builds
        run: |
          git init --quiet "$RUNNER_TEMP/app"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1 --base requirements-compiled/v4 --bootstrap "$RUNNER_TEMP/app"
          dotnet build "$RUNNER_TEMP/app/Causa.slnx" -c Release
      - name: Successor package v4.1.1 is reproduced byte for byte and its checks X01-X20 pass; its contracts and layout tests equal v4.1's
        run: |
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.1 --base requirements-compiled/v4 --forma-tarball "$RUNNER_TEMP/forma.tgz" --check
          diff -r requirements-compiled/v4.1/contracts requirements-compiled/v4.1.1/contracts
          diff -r requirements-compiled/v4.1/layout-tests requirements-compiled/v4.1.1/layout-tests
      - name: The v4.1.1 skeleton bootstraps into an empty repository and builds
        run: |
          git init --quiet "$RUNNER_TEMP/app411"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.1 --base requirements-compiled/v4 --bootstrap "$RUNNER_TEMP/app411"
          dotnet build "$RUNNER_TEMP/app411/Causa.slnx" -c Release
      - name: The v4.1.1 skeleton layers onto a recorded Conditor 0.10.18 scaffold, and both solutions build
        run: |
          fixture=tools/requirements-compiler/tests/fixtures/conditor-0.10.18-scaffold
          git init --quiet "$RUNNER_TEMP/layered"
          cp -r "$fixture"/. "$RUNNER_TEMP/layered/"
          mv "$RUNNER_TEMP/layered/gitignore.txt" "$RUNNER_TEMP/layered/.gitignore"
          rm "$RUNNER_TEMP/layered/README.md"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.1 --base requirements-compiled/v4 --check --bootstrap "$RUNNER_TEMP/layered"
          dotnet build "$RUNNER_TEMP/layered/Causa.slnx" -c Release
          dotnet build "$RUNNER_TEMP/layered/App.slnx" -c Release
      - name: Successor package v4.1.2 is reproduced byte for byte and its checks X01-X20 pass; its contracts equal v4.1.1's except the three it declares changed, and its layout tests equal v4.1.1's
        run: |
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.2 --base requirements-compiled/v4 --forma-tarball "$RUNNER_TEMP/forma.tgz" --check
          diff -r requirements-compiled/v4.1.1/layout-tests requirements-compiled/v4.1.2/layout-tests
          for f in requirements-compiled/v4.1.1/contracts/*.fs requirements-compiled/v4.1.1/contracts/negative/*.fs requirements-compiled/v4.1.1/contracts/ContractCheck.fsproj; do
            rel=${f#requirements-compiled/v4.1.1/}
            case "$rel" in
              contracts/00-DOMAIN-STUBS.fs|contracts/03-IF41-WIRE.fs|contracts/05-IF41-SAVE.fs) ;;
              *) diff "$f" "requirements-compiled/v4.1.2/$rel" ;;
            esac
          done
      - name: The v4.1.2 interface contracts typecheck, and each negative control (forged Confirmation, credential read) is refused (built outside the checkout)
        run: |
          cp -r requirements-compiled/v4.1.2/contracts "$RUNNER_TEMP/contracts412"
          cp global.json "$RUNNER_TEMP/contracts412/"
          dotnet build "$RUNNER_TEMP/contracts412/ContractCheck.fsproj" -c Release
          for negative in "$RUNNER_TEMP"/contracts412/negative/*.fs; do
            name=$(basename "$negative")
            cp "$RUNNER_TEMP/contracts412/ContractCheck.fsproj" "$RUNNER_TEMP/contracts412/Negative.fsproj"
            sed -i "s|</ItemGroup>|  <Compile Include=\"negative/$name\" />\n  </ItemGroup>|" "$RUNNER_TEMP/contracts412/Negative.fsproj"
            if dotnet build "$RUNNER_TEMP/contracts412/Negative.fsproj" -c Release > "$RUNNER_TEMP/negative412.log" 2>&1; then echo "$name compiled but must not"; exit 1; fi
            grep -q FS1093 "$RUNNER_TEMP/negative412.log" || { echo "$name failed for another reason"; cat "$RUNNER_TEMP/negative412.log"; exit 1; }
            rm "$RUNNER_TEMP/contracts412/Negative.fsproj"
          done
      - name: The v4.1.2 skeleton bootstraps into an empty repository and onto a recorded Conditor 0.10.18 scaffold, and every solution builds
        run: |
          git init --quiet "$RUNNER_TEMP/app412"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.2 --base requirements-compiled/v4 --bootstrap "$RUNNER_TEMP/app412"
          dotnet build "$RUNNER_TEMP/app412/Causa.slnx" -c Release
          fixture=tools/requirements-compiler/tests/fixtures/conditor-0.10.18-scaffold
          git init --quiet "$RUNNER_TEMP/layered412"
          cp -r "$fixture"/. "$RUNNER_TEMP/layered412/"
          mv "$RUNNER_TEMP/layered412/gitignore.txt" "$RUNNER_TEMP/layered412/.gitignore"
          rm "$RUNNER_TEMP/layered412/README.md"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.2 --base requirements-compiled/v4 --check --bootstrap "$RUNNER_TEMP/layered412"
          dotnet build "$RUNNER_TEMP/layered412/Causa.slnx" -c Release
          dotnet build "$RUNNER_TEMP/layered412/App.slnx" -c Release
      - name: Successor package v4.1.4 is reproduced byte for byte and its checks X01-X21 pass; its contracts and layout tests equal v4.1.2's
        run: |
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.4 --base requirements-compiled/v4 --forma-tarball "$RUNNER_TEMP/forma.tgz" --check
          diff -r requirements-compiled/v4.1.2/layout-tests requirements-compiled/v4.1.4/layout-tests
          diff -r requirements-compiled/v4.1.2/contracts requirements-compiled/v4.1.4/contracts
      - name: The v4.1.4 interface contracts typecheck, and each negative control (forged Confirmation, credential read) is refused (built outside the checkout)
        run: |
          cp -r requirements-compiled/v4.1.4/contracts "$RUNNER_TEMP/contracts414"
          cp global.json "$RUNNER_TEMP/contracts414/"
          dotnet build "$RUNNER_TEMP/contracts414/ContractCheck.fsproj" -c Release
          for negative in "$RUNNER_TEMP"/contracts414/negative/*.fs; do
            name=$(basename "$negative")
            cp "$RUNNER_TEMP/contracts414/ContractCheck.fsproj" "$RUNNER_TEMP/contracts414/Negative.fsproj"
            sed -i "s|</ItemGroup>|  <Compile Include=\"negative/$name\" />\n  </ItemGroup>|" "$RUNNER_TEMP/contracts414/Negative.fsproj"
            if dotnet build "$RUNNER_TEMP/contracts414/Negative.fsproj" -c Release > "$RUNNER_TEMP/negative414.log" 2>&1; then echo "$name compiled but must not"; exit 1; fi
            grep -q FS1093 "$RUNNER_TEMP/negative414.log" || { echo "$name failed for another reason"; cat "$RUNNER_TEMP/negative414.log"; exit 1; }
            rm "$RUNNER_TEMP/contracts414/Negative.fsproj"
          done
      - name: The v4.1.4 skeleton bootstraps into an empty repository and onto a recorded Conditor 0.10.18 scaffold, and every solution builds
        run: |
          git init --quiet "$RUNNER_TEMP/app414"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.4 --base requirements-compiled/v4 --bootstrap "$RUNNER_TEMP/app414"
          dotnet build "$RUNNER_TEMP/app414/Causa.slnx" -c Release
          fixture=tools/requirements-compiler/tests/fixtures/conditor-0.10.18-scaffold
          git init --quiet "$RUNNER_TEMP/layered414"
          cp -r "$fixture"/. "$RUNNER_TEMP/layered414/"
          mv "$RUNNER_TEMP/layered414/gitignore.txt" "$RUNNER_TEMP/layered414/.gitignore"
          rm "$RUNNER_TEMP/layered414/README.md"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.4 --base requirements-compiled/v4 --check --bootstrap "$RUNNER_TEMP/layered414"
          dotnet build "$RUNNER_TEMP/layered414/Causa.slnx" -c Release
          dotnet build "$RUNNER_TEMP/layered414/App.slnx" -c Release
      - name: Successor package v4.1.5 is reproduced byte for byte and its checks X01-X21 pass; its contracts equal v4.1.4's except the five it declares changed, and its layout tests equal v4.1.4's
        run: |
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.5 --base requirements-compiled/v4 --forma-tarball "$RUNNER_TEMP/forma.tgz" --check
          diff -r requirements-compiled/v4.1.4/layout-tests requirements-compiled/v4.1.5/layout-tests
          for f in requirements-compiled/v4.1.4/contracts/*.fs requirements-compiled/v4.1.4/contracts/negative/*.fs requirements-compiled/v4.1.4/contracts/ContractCheck.fsproj; do
            rel=${f#requirements-compiled/v4.1.4/}
            case "$rel" in
              contracts/00-DOMAIN-STUBS.fs|contracts/02-IF41-STORAGE.fs|contracts/05-IF41-SAVE.fs|contracts/06-IF41-APP.fs|contracts/07-IF41-VIEW.fs) ;;
              *) diff "$f" "requirements-compiled/v4.1.5/$rel" ;;
            esac
          done
      - name: v4.1.5 carries v4.1.4's owner-approved state-machine amendments unchanged, and its own two entries equal the digests ODR-V415-01 pins
        run: dotnet fsi tools/v415-carried-amendments.fsx .
      - name: The v4.1.5 interface contracts typecheck, and each negative control (forged Confirmation, credential read) is refused (built outside the checkout)
        run: |
          cp -r requirements-compiled/v4.1.5/contracts "$RUNNER_TEMP/contracts415"
          cp global.json "$RUNNER_TEMP/contracts415/"
          dotnet build "$RUNNER_TEMP/contracts415/ContractCheck.fsproj" -c Release
          for negative in "$RUNNER_TEMP"/contracts415/negative/*.fs; do
            name=$(basename "$negative")
            cp "$RUNNER_TEMP/contracts415/ContractCheck.fsproj" "$RUNNER_TEMP/contracts415/Negative.fsproj"
            sed -i "s|</ItemGroup>|  <Compile Include=\"negative/$name\" />\n  </ItemGroup>|" "$RUNNER_TEMP/contracts415/Negative.fsproj"
            if dotnet build "$RUNNER_TEMP/contracts415/Negative.fsproj" -c Release > "$RUNNER_TEMP/negative415.log" 2>&1; then echo "$name compiled but must not"; exit 1; fi
            grep -q FS1093 "$RUNNER_TEMP/negative415.log" || { echo "$name failed for another reason"; cat "$RUNNER_TEMP/negative415.log"; exit 1; }
            rm "$RUNNER_TEMP/contracts415/Negative.fsproj"
          done
      - name: The v4.1.5 skeleton bootstraps into an empty repository and onto a recorded Conditor 0.10.18 scaffold, and every solution builds
        run: |
          git init --quiet "$RUNNER_TEMP/app415"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.5 --base requirements-compiled/v4 --bootstrap "$RUNNER_TEMP/app415"
          dotnet build "$RUNNER_TEMP/app415/Causa.slnx" -c Release
          fixture=tools/requirements-compiler/tests/fixtures/conditor-0.10.18-scaffold
          git init --quiet "$RUNNER_TEMP/layered415"
          cp -r "$fixture"/. "$RUNNER_TEMP/layered415/"
          mv "$RUNNER_TEMP/layered415/gitignore.txt" "$RUNNER_TEMP/layered415/.gitignore"
          rm "$RUNNER_TEMP/layered415/README.md"
          dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.5 --base requirements-compiled/v4 --check --bootstrap "$RUNNER_TEMP/layered415"
          dotnet build "$RUNNER_TEMP/layered415/Causa.slnx" -c Release
          dotnet build "$RUNNER_TEMP/layered415/App.slnx" -c Release
      - name: Executable Forma layout assertions pass on Forma 0.12.0 patterns and fail on broken fixtures (Chromium and WebKit)
        # Bounded: a stalled browser install (apt mirror) fails this step after the limit instead of the whole job budget. No retry, so a
        # cancelled apt leaves no lock behind for a second attempt (the problem 8d58246 removed); nothing is skipped. Trade-off: on a very
        # slow mirror this can turn a slow green run red. This step (install plus the layout run) took 803 s on run 42138265759, so 25.
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/forma" "$RUNNER_TEMP/layout"
          tar -xzf "$RUNNER_TEMP/forma.tgz" -C "$RUNNER_TEMP/forma"
          cd "$RUNNER_TEMP/layout" && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.63.0 axe-core@4.14.0 > /dev/null && npx playwright install --with-deps chromium webkit > /dev/null
          cd "$GITHUB_WORKSPACE"
          cp -r requirements-compiled/v4.1/layout-tests/. "$RUNNER_TEMP/layout/"
          node "$RUNNER_TEMP/layout/run.mjs" --forma "$RUNNER_TEMP/forma/package" --contract requirements-compiled/v4.1/analysis/forma-layout-contract.json --inventory requirements-compiled/v4.1/analysis/forma-0.12.0-inventory.json --axe "$RUNNER_TEMP/layout/node_modules/axe-core/axe.min.js" --browsers chromium,webkit
          node "$RUNNER_TEMP/layout/run.mjs" --forma "$RUNNER_TEMP/forma/package" --contract requirements-compiled/v4.1/analysis/forma-layout-contract.json --inventory requirements-compiled/v4.1/analysis/forma-0.12.0-inventory.json --axe "$RUNNER_TEMP/layout/node_modules/axe-core/axe.min.js" --catch-rate
      - name: Check out maintained Causa Data tooling
        uses: actions/checkout@v4
        with:
          repository: kemiller2002/causa-data
          ref: cf1db84d3acbfbee0cb12e038e088c554ffb2641
          path: .causa-data
          persist-credentials: false
      - name: Verify the Causa rehearsal initialization interface
        working-directory: .causa-data
        run: |
          dotnet build tools/src/Causa.Tool -c Release
          dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll template-verify --template demonstration-v1
  # Rehearsal 009 readiness gates (docs/rehearsal-009-preflight-smoke/FINAL-CORRECTIONS.md): the pinned Conditor, the
  # resolved set from echelon-current, the governed Praxis policy, the Dokimos coverage gate with its candidate-SHA
  # checks and the non-empty Percepta preflight, each proven by positive and negative cases on the released binaries.
  release-gate-repair:
    # docs/release-gate-repair: the suite-command defects Rehearsal 009 hit stay refused, the corrected v4.1.4 runners
    # execute, the Praxis ordering gate and the acceptance levels behave as specified.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pinned Conditor 0.10.20 and the echelon-current 1.36.0 workstation, in a disposable home
        run: |
          dotnet fsi tools/r9/r9.fsx -- install-conditor --lock kickoff/rehearsal-009/toolchain.lock.json --dir "$RUNNER_TEMP/conditor"
          dotnet fsi tools/r9/r9.fsx -- workstation --lock kickoff/rehearsal-009/toolchain.lock.json \
            --conditor "$RUNNER_TEMP/conditor/conditor" --home "$RUNNER_TEMP/echelon" --target-id "indy-init-rg-${{ github.run_id }}"
          echo "$RUNNER_TEMP/echelon/.local/bin" >> "$GITHUB_PATH"
      - name: Build the requirements compiler
        run: dotnet build tools/requirements-compiler/src -c Release
      - name: Candidate package v4.1.4 is reproduced byte for byte and X01-X21 pass
        run: dotnet tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll v41 --source . --package requirements-compiled/v4.1.4 --base requirements-compiled/v4 --check
      - name: Percepta's specification preflight finds nothing blocking in v4.1.4 (FREEZE.md step 2)
        run: |
          percepta spec-preflight --machines requirements-compiled/v4.1.4/state-machine-contracts.json --invariants requirements-compiled/v4/invariants.json \
            --interfaces requirements-compiled/v4.1.4/analysis/interface-specifications.json --out "$RUNNER_TEMP/spec-preflight-v414.json"
          jq -e '.blocked == false and (.blockingContradictions | length) == 0 and .analysed.transitions > 0' "$RUNNER_TEMP/spec-preflight-v414.json"
      - name: Playwright test runner (the version the owner locked, ODR-V41-07)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm install --no-audit --no-fund @playwright/test@1.63.0 > /dev/null
      - name: Release-gate repair cases
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          dotnet fsi tools/release-gate-repair/tests.fsx -- --indy-init . --praxis "$RUNNER_TEMP/echelon/.local/bin/praxis" \
            --node-modules "$RUNNER_TEMP/pw/node_modules" --work "$RUNNER_TEMP/rg-work" --evidence "$RUNNER_TEMP/rg-evidence"
      - name: The obligation inventory is what the generator writes from the committed inputs
        run: |
          dotnet fsi tools/release-gate-repair/inventory.fsx -- --plan requirements-compiled/v4/verification-plan.json \
            --execution-plan requirements-compiled/v4.1.4/verification-execution-plan.json \
            --ownership requirements-compiled/v4.1.4/agent-file-ownership.json --dag requirements-compiled/v4.1.4/execution-dag.json \
            --coverage docs/release-gate-repair/evidence/r9-release-gate/coverage.json --gate docs/release-gate-repair/evidence/r9-release-gate/gate.json \
            --suite-preflight docs/release-gate-repair/evidence/suite-preflight-v4.1.2-r9.json --out "$RUNNER_TEMP/inventory.json"
          cmp "$RUNNER_TEMP/inventory.json" docs/release-gate-repair/obligation-inventory.json
      - name: Publish the repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-repair
          path: ${{ runner.temp }}/rg-evidence

  r9-readiness-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pinned Conditor 0.10.20 and the echelon-current 1.36.0 workstation, in a disposable home
        run: |
          dotnet fsi tools/r9/r9.fsx -- install-conditor --lock kickoff/rehearsal-009/toolchain.lock.json --dir "$RUNNER_TEMP/conditor"
          dotnet fsi tools/r9/r9.fsx -- workstation --lock kickoff/rehearsal-009/toolchain.lock.json \
            --conditor "$RUNNER_TEMP/conditor/conditor" --home "$RUNNER_TEMP/echelon" --target-id "indy-init-ci-${{ github.run_id }}"
      - name: Build the requirements compiler (verify-process judges record evidence)
        run: dotnet build tools/requirements-compiler/src -c Release
      - name: Readiness gates, positive and negative cases
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          dotnet fsi tools/r9/tests.fsx -- --indy-init . --bin "$RUNNER_TEMP/echelon/.local/bin" \
            --conditor "$RUNNER_TEMP/conditor/conditor" --work "$RUNNER_TEMP/r9-work" --evidence "$RUNNER_TEMP/r9-evidence"
      - name: Publish the gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r9-readiness-gates
          path: ${{ runner.temp }}/r9-evidence
  # Rehearsal 009's release gate failed in run-suites: two `dotnet test` runners named several projects (MSB1008) and
  # SU-BROWSER-WEBKIT named a Playwright project nobody defined. This job proves, on a deterministic fixture tree with
  # the plan's layout (no application code), that the frozen v4.1.2 commands are refused and that every executable
  # suite of the successor v4.1.4 lists and runs, WebKit included. The release-gate-repair harness lists the same
  # commands; this job also executes them (docs/rehearsal-010-readiness/INTEGRATION-REPORT.md).
  suite-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fixture trees (with and without the webkit project)
        # Bounded: a stalled browser install (apt mirror) fails this step after the limit instead of the whole job budget. No retry, so a
        # cancelled apt leaves no lock behind for a second attempt (the problem 8d58246 removed); nothing is skipped. Trade-off: on a very
        # slow mirror (slowest measured success 664 s) this can turn a slow green run red; 15 minutes leaves that margin.
        timeout-minutes: 15
        run: |
          dotnet fsi tools/r9/r9.fsx -- suite-fixture --out "$RUNNER_TEMP/fx"
          dotnet fsi tools/r9/r9.fsx -- suite-fixture --out "$RUNNER_TEMP/fx-nowebkit" --without-webkit true
          (cd "$RUNNER_TEMP/fx" && npm install --no-audit --no-fund && npx playwright install --with-deps chromium webkit)
          cp -r "$RUNNER_TEMP/fx/node_modules" "$RUNNER_TEMP/fx-nowebkit/"
      - name: The frozen v4.1.2 commands are refused (MSB1008), and a missing webkit project is refused
        run: |
          set +e
          dotnet fsi tools/r9/r9.fsx -- suite-preflight --plan requirements-compiled/v4.1.2/verification-execution-plan.json --root "$RUNNER_TEMP/fx" --out "$RUNNER_TEMP/v412.json" --require-tests true
          test $? -eq 4 || { echo "::error::v4.1.2 was not refused"; exit 1; }
          jq -e '[.suites[] | select(.cause != "") | .id] == ["SU-OWN-DOTNET","SU-DOTNET-LIVE"]' "$RUNNER_TEMP/v412.json" || exit 1
          dotnet fsi tools/r9/r9.fsx -- suite-preflight --plan requirements-compiled/v4.1.4/verification-execution-plan.json --root "$RUNNER_TEMP/fx-nowebkit" --out "$RUNNER_TEMP/nowebkit.json" --require-tests true
          test $? -eq 4 || { echo "::error::a missing webkit project was not refused"; exit 1; }
          jq -e '[.suites[] | select(.cause != "") | .id] == ["SU-BROWSER-WEBKIT"]' "$RUNNER_TEMP/nowebkit.json" || exit 1
      - name: Every v4.1.4 suite command lists and runs, each test passing (WebKit included)
        run: |
          dotnet fsi tools/r9/r9.fsx -- suite-preflight --plan requirements-compiled/v4.1.4/verification-execution-plan.json --root "$RUNNER_TEMP/fx" --out "$RUNNER_TEMP/v414.json" --require-tests true
          dotnet fsi tools/r9/r9.fsx -- run-suites --plan requirements-compiled/v4.1.4/verification-execution-plan.json --root "$RUNNER_TEMP/fx" --out "$RUNNER_TEMP/runs" --require-tests true
          for f in "$RUNNER_TEMP"/runs/*/run.log; do head -2 "$f"; done
          if grep -l 'outcome="Failed"' "$RUNNER_TEMP"/runs/*/*.trx; then echo "::error::a suite test failed"; exit 1; fi
          for s in SU-OWN-BROWSER SU-BROWSER-CHROMIUM SU-BROWSER-WEBKIT SU-BROWSER-LIVE; do
            jq -e '.stats.unexpected == 0 and .stats.expected > 0' "$RUNNER_TEMP/runs/$s/results.json" || { echo "::error::$s did not pass"; exit 1; }
          done

  # The adversarial cases run in three parallel shards (directive workstream C: the serial case step was ~16 of the
  # job's ~21.5 minutes). r10-adversarial, the check name branch protection knows, needs the shards, runs with
  # always() so a failed or cancelled shard can never leave it "skipped" (which would read as passing), refuses unless
  # every shard succeeded, and proves the shards' union is the whole case list before its own steps run.
  r10-adversarial-cases:
    runs-on: ubuntu-latest
    # Browsers and their OS libraries come preinstalled in Playwright's image (the tag must equal @playwright/test).
    # Installing them per run with `playwright install --with-deps` pulled ~100 apt packages from the runner mirror and,
    # on a slow mirror, used the whole 45-minute budget before any case ran (PR #140, runs 42115761982 and 42122833553).
    container:
      # Pinned by digest (the index digest docker pulled in run 42134469740), so the image cannot change under the tag.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    defaults:
      run:
        shell: bash -e {0}   # what these steps ran with on the runner; a container defaults to sh
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Tools the image does not carry (git, jq, curl, ICU for .NET)
        timeout-minutes: 6
        run: |
          # Bounded and labelled: an unreachable apt mirror fails here, by name, before any case runs (never as a pass).
          timeout -k 15 300 sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends git jq curl ca-certificates libicu74 > /dev/null' \
            || { echo "::error::phase=container-tools: apt could not install git, jq, curl and ICU within 5 minutes; no case ran"; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pinned Conditor and the echelon-current workstation
        run: |
          dotnet fsi tools/r9/r9.fsx -- install-conditor --lock kickoff/rehearsal-009/toolchain.lock.json --dir "$RUNNER_TEMP/conditor"
          dotnet fsi tools/r9/r9.fsx -- workstation --lock kickoff/rehearsal-009/toolchain.lock.json \
            --conditor "$RUNNER_TEMP/conditor/conditor" --home "$RUNNER_TEMP/echelon" --target-id "indy-init-adv-${{ github.run_id }}"
          echo "$RUNNER_TEMP/echelon/.local/bin" >> "$GITHUB_PATH"
      - name: Playwright, Chromium and WebKit; Forma for the harness fixture
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null
          npm install --no-audit --no-fund @playwright/test@1.63.0 axe-core@4.14.0 > /dev/null
          # Chromium and WebKit are already in the container image (no per-run download or apt install).
          npm pack @echelon-foundry/design-system@0.13.0 > /dev/null && mkdir forma && tar -xzf echelon-foundry-design-system-0.13.0.tgz -C forma
          mkdir -p "$GITHUB_WORKSPACE/verification/harness/fixture-app/web/vendor/forma"
          cp forma/package/dist/all.css "$GITHUB_WORKSPACE/verification/harness/fixture-app/web/vendor/forma/all.css"
      - name: Adversarial validation (shard ${{ matrix.shard }} of 3)
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          dotnet fsi tools/r10/adversarial.fsx -- --indy-init . --work "$RUNNER_TEMP/adv" --evidence "$RUNNER_TEMP/adv-evidence" \
            --node-modules "$RUNNER_TEMP/pw/node_modules" --browsers true --dotnet-tests true --shard ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/adv-evidence

  r10-adversarial:
    needs: r10-adversarial-cases
    if: always()
    runs-on: ubuntu-latest
    # Browsers and their OS libraries come preinstalled in Playwright's image (the tag must equal @playwright/test).
    # Installing them per run with `playwright install --with-deps` pulled ~100 apt packages from the runner mirror and,
    # on a slow mirror, used the whole 45-minute budget before any case ran (PR #140, runs 42115761982 and 42122833553).
    container:
      # Pinned by digest (the index digest docker pulled in run 42134469740), so the image cannot change under the tag.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    defaults:
      run:
        shell: bash -e {0}   # what these steps ran with on the runner; a container defaults to sh
    timeout-minutes: 45
    steps:
      - name: Tools the image does not carry (git, jq, curl, ICU for .NET)
        timeout-minutes: 6
        run: |
          # Bounded and labelled: an unreachable apt mirror fails here, by name, before any case runs (never as a pass).
          timeout -k 15 300 sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends git jq curl ca-certificates libicu74 > /dev/null' \
            || { echo "::error::phase=container-tools: apt could not install git, jq, curl and ICU within 5 minutes; no case ran"; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Every adversarial shard succeeded
        run: |
          test "${{ needs.r10-adversarial-cases.result }}" = success || { echo "::error::adversarial shards: ${{ needs.r10-adversarial-cases.result }}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: adversarial-shard-*
          path: ${{ runner.temp }}/adv-shards
      - name: The shards together ran the whole case list, and every case was validated
        run: |
          R="$RUNNER_TEMP/adv-shards"
          ls "$R"/adversarial-shard-{0,1,2}/adversarial-results.json
          jq -s -e '
            (.[0].allCases | sort) as $all
            | ([.[].allCases | sort] | unique | length == 1)
            and ([.[].cases[].id] | sort) == $all
            and ([.[].cases[] | select(.verdict != "VALIDATED")] | length == 0)
            and ($all | length) > 0' "$R"/adversarial-shard-*/adversarial-results.json \
            || { echo "::error::the adversarial shards do not cover every case exactly once, or a case did not validate (NOT-RUN included: every shard runs with browsers and .NET tests)"; exit 1; }
          jq -r '.cases[] | "\(.id) \(.verdict)"' "$R"/adversarial-shard-*/adversarial-results.json | sort
          mkdir -p "$RUNNER_TEMP/adv-evidence" && cp -r "$R"/. "$RUNNER_TEMP/adv-evidence/"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pinned Conditor and the echelon-current workstation
        run: |
          dotnet fsi tools/r9/r9.fsx -- install-conditor --lock kickoff/rehearsal-009/toolchain.lock.json --dir "$RUNNER_TEMP/conditor"
          dotnet fsi tools/r9/r9.fsx -- workstation --lock kickoff/rehearsal-009/toolchain.lock.json \
            --conditor "$RUNNER_TEMP/conditor/conditor" --home "$RUNNER_TEMP/echelon" --target-id "indy-init-adv-${{ github.run_id }}"
          echo "$RUNNER_TEMP/echelon/.local/bin" >> "$GITHUB_PATH"
      - name: Playwright, Chromium and WebKit; Forma for the harness fixture
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null
          npm install --no-audit --no-fund @playwright/test@1.63.0 axe-core@4.14.0 > /dev/null
          # Chromium and WebKit are already in the container image (no per-run download or apt install).
          npm pack @echelon-foundry/design-system@0.13.0 > /dev/null && mkdir forma && tar -xzf echelon-foundry-design-system-0.13.0.tgz -C forma
          mkdir -p "$GITHUB_WORKSPACE/verification/harness/fixture-app/web/vendor/forma"
          cp forma/package/dist/all.css "$GITHUB_WORKSPACE/verification/harness/fixture-app/web/vendor/forma/all.css"
      - name: Governed journeys and the rendered design contract on the positive-control fixture, Chromium and WebKit
        run: |
          node verification/harness/github-double.mjs 4610 & node verification/harness/serve.mjs verification/harness/fixture-app/web 4620 & sleep 1
          ln -sfn "$RUNNER_TEMP/pw/node_modules" verification/journeys/node_modules
          ln -sfn "$RUNNER_TEMP/pw/node_modules" verification/design-contract/node_modules
          export CAUSA_PROVIDER=harness-double CAUSA_APP_URL=http://127.0.0.1:4620/ CAUSA_CANDIDATE=fixture
          (cd verification/journeys && CAUSA_JOURNEY_RESULTS="$RUNNER_TEMP/adv-evidence/journeys-fixture.json" npx playwright test)
          (cd verification/design-contract && CAUSA_DESIGN_RENDERED="$RUNNER_TEMP/adv-evidence/design-rendered-fixture.json" CAUSA_SCREENSHOTS="$RUNNER_TEMP/adv-evidence/screenshots" npx playwright test)
      - name: Rehearsal 009 read-only replay
        run: |
          git clone -q https://github.com/kemiller2002/indy-init-rehearsal-009 "$RUNNER_TEMP/r9"
          dotnet fsi tools/r10/r9-replay.fsx -- --indy-init . --r9 "$RUNNER_TEMP/r9" --work "$RUNNER_TEMP/replay" --evidence "$RUNNER_TEMP/replay-evidence" --suites true
      - name: Launch preflight refuses every missing condition (negative controls; synthetic fixtures)
        run: dotnet fsi tools/r10/launch-preflight-tests.fsx -- --indy-init . --work "$RUNNER_TEMP/launch-controls" --evidence "$RUNNER_TEMP/launch-evidence"
      - name: Topology A schedule from the slice manifest (the committed evidence must be reproducible)
        run: |
          dotnet fsi tools/r10/schedule.fsx -- --slices docs/rehearsal-010-readiness/slice-execution-manifest.json --window 420 --setup 45 \
            --ci 0,5,10,15,20,25 --merge 3 --lanes "integration:integration,domain:domain,persistence:persistence,ui-1:ui,ui-2:ui,reviewer:reviewer" \
            --out "$RUNNER_TEMP/launch-evidence/topology-a.json"
          jq -S 'del(.scenarios[].timeline)' "$RUNNER_TEMP/launch-evidence/topology-a.json" > "$RUNNER_TEMP/a.json"
          jq -S 'del(.scenarios[].timeline)' docs/rehearsal-010-readiness/evidence/schedule/topology-a.json > "$RUNNER_TEMP/b.json"
          diff "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json" || { echo "::error::the committed schedule evidence is stale; regenerate it"; exit 1; }
      - name: Schedule model (docs/rehearsal-010-optimization) equals schedule.fsx under its defaults, and its invariants and controls hold
        run: dotnet fsi tools/r10/schedule-model-tests.fsx -- --indy-init .
      - name: Delegated authority (DA-R10-1) records stay in scope and are never owner approvals
        run: |
          # review N1: judge with main's copy of the checker; only the PR that introduces it (none on main) runs its own
          git fetch -q --depth=1 origin main
          DA="$RUNNER_TEMP/delegated-authority.fsx"
          git show FETCH_HEAD:tools/r10/delegated-authority.fsx > "$DA" 2>/dev/null || cp tools/r10/delegated-authority.fsx "$DA"
          dotnet fsi "$DA" -- --indy-init . test
          dotnet fsi "$DA" -- --indy-init . check --base-ref FETCH_HEAD
          dotnet fsi tools/r10/delegated-authority.fsx -- --indy-init . test
      - name: Change-impact selection (proposed Level 2; never the gate) holds its adversarial cases
        run: dotnet fsi tools/r10/change-impact.fsx -- --indy-init . test
      - name: Proposed successor manifests regenerate from their scope manifests (review RVO-3-3; the committed files must not be stale or edited)
        run: |
          dotnet build tools/requirements-compiler/src -c Release -v q
          RC=tools/requirements-compiler/src/bin/Release/net10.0/requirements-compiler.dll; P=docs/rehearsal-010-optimization/proposals
          for v in successor milestone-aligned; do
            dotnet $RC slice-manifest --manifest $P/scope-manifest.$v.json --dag requirements-compiled/v4.1.4/execution-dag.json \
              --journeys verification/journeys/bindings.json --out "$RUNNER_TEMP/slices.$v.json"
            dotnet $RC scope work-plan --manifest $P/scope-manifest.$v.json --out "$RUNNER_TEMP/inventory.$v.json"
            diff <(jq -S . "$RUNNER_TEMP/slices.$v.json") <(jq -S . $P/slice-execution-manifest.$v.json) || { echo "::error::$P/slice-execution-manifest.$v.json is stale or edited"; exit 1; }
            diff <(jq -S . "$RUNNER_TEMP/inventory.$v.json") <(jq -S . $P/praxis-work-inventory.$v.json) || { echo "::error::$P/praxis-work-inventory.$v.json is stale or edited"; exit 1; }
          done
      - name: Gather the evidence under one folder (the artifact keeps the same three top-level folders)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/r10-evidence"
          for d in adv-evidence replay-evidence launch-evidence; do [ -d "$RUNNER_TEMP/$d" ] && cp -r "$RUNNER_TEMP/$d" "$RUNNER_TEMP/r10-evidence/"; done; true
      - name: Publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-adversarial
          path: ${{ runner.temp }}/r10-evidence
